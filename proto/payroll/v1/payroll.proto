syntax = "proto3";

package workforce.payroll.v1;

import "common/v1/common.proto";

option go_package = "otto/internal/gen/payroll/v1;payrollv1";

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service PayrollService {
  // GetPayroll retrieves one or more pay-run records for an employee,
  // optionally scoped to a named period such as "latest" or "2024-Q1".
  rpc GetPayroll(GetPayrollRequest) returns (GetPayrollResponse);

  // GetPaySchedule returns the active pay schedule for an employee,
  // including pay frequency and the next anticipated pay date.
  rpc GetPaySchedule(GetPayScheduleRequest) returns (PaySchedule);

  // ListPayRuns returns a filterable, paginated list of pay-run records
  // for an employee, optionally scoped by date range and/or status.
  rpc ListPayRuns(ListPayRunsRequest) returns (ListPayRunsResponse);

  // GetPayRates returns the configured hourly rate card for an employee
  // (day, night, weekend, and overtime rates).
  rpc GetPayRates(GetPayRatesRequest) returns (PayRates);

  // SetPayRates creates or replaces the hourly rate card for an employee.
  rpc SetPayRates(SetPayRatesRequest) returns (PayRates);

  // CalculatePayPreview computes a real-time pay breakdown for an employee
  // across a date range, applying day/night/weekend/overtime rates to each
  // logged shift, and projects an end-of-period total from scheduled shifts.
  rpc CalculatePayPreview(CalculatePayPreviewRequest) returns (PayPreview);
}

// ---------------------------------------------------------------------------
// Messages
// ---------------------------------------------------------------------------

// PayRun represents a single pay disbursement for one employee.
message PayRun {
  // Unique identifier for this pay run.
  string id = 1;
  // The employee this pay run belongs to.
  string employee_id = 2;
  // ISO 8601 date marking the start of the pay period.
  string period_start = 3;
  // ISO 8601 date marking the end of the pay period.
  string period_end = 4;
  // Total earnings before deductions.
  workforce.common.v1.Money gross = 5;
  // Take-home amount after all deductions.
  workforce.common.v1.Money net = 6;
  // Current processing state, e.g. "pending", "processed", "paid".
  string status = 7;
  // ISO 8601 timestamp when the funds were disbursed; empty if not yet paid.
  string paid_at = 8;
}

// GetPayrollRequest identifies an employee and an optional period qualifier.
message GetPayrollRequest {
  // UUID of the employee whose payroll is being requested.
  string employee_id = 1;
  // Human-readable period selector such as "latest", "2024-Q1", or a
  // specific ISO 8601 date. Leave empty to return all runs.
  optional string pay_period = 2;
}

// GetPayrollResponse returns all matching pay runs for the requested employee.
message GetPayrollResponse {
  // The employee these pay runs belong to.
  string employee_id = 1;
  repeated PayRun pay_runs = 2;
}

// PaySchedule describes when and how often an employee is paid.
message PaySchedule {
  // Unique identifier for this schedule record.
  string id = 1;
  // The employee this schedule applies to.
  string employee_id = 2;
  // How often the employee is paid.
  workforce.common.v1.PayFrequency frequency = 3;
  // ISO 8601 date from which this schedule takes effect.
  string effective_date = 4;
  // ISO 8601 date of the next upcoming pay disbursement.
  string next_pay_date = 5;
}

// GetPayScheduleRequest identifies the employee whose schedule is needed.
message GetPayScheduleRequest {
  string employee_id = 1;
}

// ListPayRunsRequest supports rich filtering of pay-run history.
message ListPayRunsRequest {
  // UUID of the employee whose pay runs are being listed.
  string employee_id = 1;
  // When set, restricts results to pay runs whose period overlaps this range.
  optional workforce.common.v1.DateRange date_range = 2;
  // When set, restricts results to pay runs with this status string.
  optional string status = 3;
}

// ListPayRunsResponse carries the filtered pay-run list with a total count.
message ListPayRunsResponse {
  repeated PayRun pay_runs = 1;
  // Total number of pay runs matching the filter (before any pagination).
  int32 total_count = 2;
}

// ---------------------------------------------------------------------------
// Predictive Payroll — Rate Card
// ---------------------------------------------------------------------------

// PayRates holds the hourly rate card for one employee.
message PayRates {
  // Unique identifier for this rate record.
  string id = 1;
  // The employee these rates apply to.
  string employee_id = 2;
  // ISO 4217 currency code, e.g. "USD".
  string currency_code = 3;
  // Weekday daytime rate (06:00–18:00 UTC), in currency minor units per hour.
  int64 day_rate_cents = 4;
  // Weekday night rate (18:00–06:00 UTC), in currency minor units per hour.
  int64 night_rate_cents = 5;
  // Weekend rate (Saturday & Sunday, all hours), in currency minor units per hour.
  int64 weekend_rate_cents = 6;
  // Rate applied to weekday hours that exceed overtime_threshold_hours in a week.
  int64 overtime_rate_cents = 7;
  // Weekly hour threshold after which overtime applies (default 40.0).
  double overtime_threshold_hours = 8;
  // ISO 8601 timestamp of the last update.
  string updated_at = 9;
}

// GetPayRatesRequest identifies the employee whose rate card is needed.
message GetPayRatesRequest {
  string employee_id = 1;
}

// SetPayRatesRequest creates or replaces the hourly rate card for an employee.
message SetPayRatesRequest {
  string employee_id = 1;
  string currency_code = 2;
  int64 day_rate_cents = 3;
  int64 night_rate_cents = 4;
  int64 weekend_rate_cents = 5;
  int64 overtime_rate_cents = 6;
  // Weekly overtime threshold in hours; defaults to 40.0 if omitted.
  optional double overtime_threshold_hours = 7;
}

// ---------------------------------------------------------------------------
// Predictive Payroll — Pay Preview
// ---------------------------------------------------------------------------

// CalculatePayPreviewRequest requests a real-time pay estimate.
message CalculatePayPreviewRequest {
  // UUID of the employee.
  string employee_id = 1;
  // Date range to calculate over.  Defaults to the current calendar month
  // when omitted.
  optional workforce.common.v1.DateRange date_range = 2;
}

// PayPreview is the result of a real-time pay calculation.  Hours and
// earnings are broken down by rate type; overtime hours are already
// deducted from the regular day/night totals.
message PayPreview {
  string employee_id = 1;
  // Inclusive start of the evaluated period (ISO 8601 date).
  string period_start = 2;
  // Inclusive end of the evaluated period (ISO 8601 date).
  string period_end = 3;

  // ── Hours breakdown ──────────────────────────────────────────────────────
  // Weekday daytime hours (after overtime is deducted).
  double regular_day_hours = 4;
  // Weekday night hours (after overtime is deducted).
  double regular_night_hours = 5;
  // Weekend hours (Saturday & Sunday).
  double weekend_hours = 6;
  // Weekday hours that exceeded the weekly overtime threshold.
  double overtime_hours = 7;

  // ── Earnings breakdown ───────────────────────────────────────────────────
  workforce.common.v1.Money day_earnings = 8;
  workforce.common.v1.Money night_earnings = 9;
  workforce.common.v1.Money weekend_earnings = 10;
  workforce.common.v1.Money overtime_earnings = 11;

  // ── Totals ───────────────────────────────────────────────────────────────
  // Gross earnings from COMPLETED shifts only.
  workforce.common.v1.Money earned_to_date = 12;
  // Gross earnings projected from all COMPLETED + SCHEDULED shifts in the period.
  workforce.common.v1.Money projected_total = 13;

  // ── Shift counts ─────────────────────────────────────────────────────────
  int32 completed_shifts = 14;
  int32 scheduled_shifts = 15;
}
