services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: otto
      POSTGRES_USER: otto
      POSTGRES_PASSWORD: otto
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otto -d otto"]
      interval: 5s
      timeout: 5s
      retries: 10

  grpc-server:
    build:
      context: .
      dockerfile: cmd/server/Dockerfile
    environment:
      DATABASE_URL: postgres://otto:otto@postgres/otto?sslmode=disable
      GRPC_ADDR: ":50051"
      MCP_ADDR: ":8080"
      # MCP dials back into the local gRPC server, but neither MCP nor the
      # TUI currently propagate an x-tenant-id header. Use the seed tenant.
      SKIP_AUTH_INTERCEPTOR: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  tui:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      MCP_URL: http://grpc-server:8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
    stdin_open: true
    tty: true
    depends_on:
      - grpc-server
    profiles:
      - tui

volumes:
  postgres_data:
